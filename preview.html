<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Petals Automation - Soft SaaS Enterprise OS</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            purple: {
              50: '#F3F1FF',
              100: '#ECE8FF',
              500: '#8B7BFF', // Secondary Purple
              600: '#6D5EF8', // Primary Purple
              700: '#5849D6',
            },
            slate: {
              50: '#FAFBFF',  // Light Soft Canvas Background
              100: '#F4F2FF',
              200: '#ECECF5',  // Border Color
              400: '#9CA3AF',
              500: '#6B7280',
              900: '#202124',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #FAFBFF;
      color: #202124;
      letter-spacing: -0.01em;
    }
    
    .soft-card {
      background-color: #FFFFFF;
      border: 1px solid #ECECF5;
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0px 10px 35px rgba(108, 92, 231, 0.10);
      transition: transform 300ms ease, box-shadow 300ms ease;
    }

    .soft-card-hover:hover {
      transform: translateY(-4px);
      box-shadow: 0px 18px 45px rgba(108, 92, 231, 0.18);
    }

    .btn-purple-gradient {
      background: linear-gradient(135deg, #6D5EF8 0%, #8B7BFF 100%);
      color: #FFFFFF;
      font-weight: 700;
      border-radius: 14px;
      box-shadow: 0px 8px 25px rgba(109, 94, 248, 0.25);
      transition: all 250ms ease;
    }

    .btn-purple-gradient:hover {
      transform: translateY(-2px);
      box-shadow: 0px 12px 30px rgba(109, 94, 248, 0.38);
    }

    .sidebar-active {
      background: linear-gradient(135deg, #6D5EF8 0%, #8B7BFF 100%) !important;
      color: #FFFFFF !important;
      font-weight: 700 !important;
      box-shadow: 0px 6px 20px rgba(109, 94, 248, 0.3) !important;
      border-radius: 14px !important;
    }

    .hero-title { font-size: 56px; line-height: 1.1; font-weight: 800; letter-spacing: -0.025em; }
    .heading-title { font-size: 34px; line-height: 1.2; font-weight: 700; letter-spacing: -0.02em; }
    .section-title { font-size: 26px; line-height: 1.25; font-weight: 700; letter-spacing: -0.015em; }
    .card-title { font-size: 20px; line-height: 1.3; font-weight: 600; }
    .body-text { font-size: 16px; line-height: 1.5; }
    .small-text { font-size: 14px; line-height: 1.4; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #6D5EF8; }
  </style>
</head>
<body class="selection:bg-purple-600 selection:text-white overflow-x-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // Accounts Database
    const USER_DATABASE = [
      {
        id: 'usr-admin',
        email: 'admin@petals.com',
        password: 'admin123',
        name: 'Sarah Jenkins',
        role: 'Admin',
        designation: 'VP of HR & Operations',
        department: 'Human Resources & Executive',
        avatar: 'https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=150&auto=format&fit=crop&q=80'
      },
      {
        id: 'usr-tl',
        email: 'tl@petals.com',
        password: 'tl123',
        name: 'Rajesh Kulkarni',
        role: 'Team Leader',
        designation: 'Embedded Systems Lead Engineer',
        department: 'Embedded Systems',
        avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&auto=format&fit=crop&q=80'
      }
    ];

    const INITIAL_PROJECTS = [
      { id: 'prj-101', code: 'PET-MOT-04', name: 'STM32 Dual-Core Motor Controller Firmware', category: 'Embedded Systems', status: 'Active', progress: 78, deadline: '2026-08-25', lead: 'Rajesh Kulkarni', budgetHours: 320, loggedHours: 245, description: 'High-speed vector control algorithm development for 3-phase industrial servo motors.' },
      { id: 'prj-102', code: 'PET-SCA-09', name: 'Next-Gen SCADA Plant Supervisory Dashboard', category: 'SCADA Software', status: 'Active', progress: 62, deadline: '2026-09-10', lead: 'Rajesh Kulkarni', budgetHours: 450, loggedHours: 280, description: 'Real-time telemetry and predictive maintenance Web SCADA interface.' }
    ];

    const INITIAL_EMPLOYEES = [];

    const INITIAL_TASKS = [];

    const INITIAL_DEPARTMENTS = [
      'Embedded Systems',
      'Embedded Developer',
      'SCADA Software',
      'Software Developer',
      'Hardware & PCB',
      'Business Development Executive',
      'Digital Marketing',
      'Accountant',
      'Designer',
      'Trainee',
      'Human Resources & Executive'
    ];

    function MasterApp() {
      const [authenticatedUser, setAuthenticatedUser] = useState(null);
      const [emailInput, setEmailInput] = useState('admin@petals.com');
      const [passwordInput, setPasswordInput] = useState('admin123');
      const [loginError, setLoginError] = useState('');

      const [activeView, setActiveView] = useState('dashboard');
      const [searchQuery, setSearchQuery] = useState('');
      const [toastMessage, setToastMessage] = useState('');

      const [tasks, setTasks] = useState(INITIAL_TASKS);
      const [projects, setProjects] = useState(INITIAL_PROJECTS);
      const [employees, setEmployees] = useState(INITIAL_EMPLOYEES);
      const [userDatabase, setUserDatabase] = useState(USER_DATABASE);
      const [departments, setDepartments] = useState(INITIAL_DEPARTMENTS);

      // Custom department entry state
      const [isCustomDept, setIsCustomDept] = useState(false);
      const [customDeptText, setCustomDeptText] = useState('');

      // Status change prompt modal state
      const [statusPromptModal, setStatusPromptModal] = useState(null);
      const [promptInputText, setPromptInputText] = useState('');

      // Edit task modal state
      const [editTaskModal, setEditTaskModal] = useState(null);

      // HR Edit Credentials Modal state (Admin Only)
      const [editCredentialsModal, setEditCredentialsModal] = useState(null);
      const [isCustomDeptEdit, setIsCustomDeptEdit] = useState(false);
      const [customDeptTextEdit, setCustomDeptTextEdit] = useState('');

      // Add & Edit Project Modal State (Admin)
      const [showAddProjectModal, setShowAddProjectModal] = useState(false);
      const [editProjectModal, setEditProjectModal] = useState(null);
      const [newPrjName, setNewPrjName] = useState('');
      const [newPrjCode, setNewPrjCode] = useState('');
      const [newPrjLead, setNewPrjLead] = useState(INITIAL_EMPLOYEES[0]?.name || 'Rajesh Kulkarni');
      const [newPrjStatus, setNewPrjStatus] = useState('Active');

      // Add New Employee Modal state (Admin)
      const [showAddEmployeeModal, setShowAddEmployeeModal] = useState(false);
      const [newEmpName, setNewEmpName] = useState('');
      const [newEmpEmail, setNewEmpEmail] = useState('');
      const [newEmpPassword, setNewEmpPassword] = useState('');
      const [newEmpRole, setNewEmpRole] = useState('Employee');
      const [newEmpDesignation, setNewEmpDesignation] = useState('Embedded Systems Engineer');
      const [newEmpDepartment, setNewEmpDepartment] = useState('Embedded Systems');

      // Zoho Mail Notifications State
      const [showZohoMailModal, setShowZohoMailModal] = useState(false);
      const [zohoMailLogs, setZohoMailLogs] = useState([
        {
          id: 'eml-1412',
          subject: 'Task Updated: IoT kit - V1 LMS Q and A preparation for scratch coding [#1412]',
          to: 'krishna@petalsautomations.com',
          toName: 'KrishnaMoorthy',
          from: 'Karthikeyan (mkarthikeyan@petalsautomations.com)',
          status: 'Delivered (Zoho Mail)',
          timestamp: '2026-08-06 03:15 PM',
          taskName: 'IoT kit - V1 LMS Q and A preparation for scratch coding',
          previousStatus: 'Hold',
          currentStatus: 'HOLD',
          updatedBy: 'Karthikeyan',
          changes: [
            { field: 'Due Date', previous: '2026-08-05', updated: '2026-08-08' }
          ]
        },
        {
          id: 'eml-801',
          subject: 'Task Assigned: Implement Fieldbus CANopen Driver Protocol Stack [#TSK-801]',
          to: 'employee@petals.com',
          toName: 'Priya Sundaram',
          from: 'Rajesh Kulkarni (tl@petals.com)',
          status: 'Delivered (Zoho Mail)',
          timestamp: '2026-08-06 01:45 PM',
          taskName: 'Implement Fieldbus CANopen Driver Protocol Stack',
          previousStatus: 'Created',
          currentStatus: 'In Progress',
          updatedBy: 'Rajesh Kulkarni',
          changes: [
            { field: 'Status', previous: 'Pending', updated: 'In Progress' },
            { field: 'Due Date', previous: '2026-08-01', updated: '2026-08-08' }
          ]
        }
      ]);
      const [selectedZohoLog, setSelectedZohoLog] = useState(null);

      const triggerZohoMail = (recipientName, recipientEmail, taskName, taskId, previousStatus, currentStatus, updatedBy, changesMade) => {
        const newMailObj = {
          id: `eml-${Date.now()}`,
          subject: `Task Updated: ${taskName} [#${taskId}]`,
          to: recipientEmail || 'employee@petals.com',
          toName: recipientName || 'Team Member',
          from: `${authenticatedUser?.name || 'Manager'} (${authenticatedUser?.email || 'admin@petals.com'})`,
          status: 'Delivered (Zoho Mail SMTP)',
          timestamp: new Date().toLocaleString(),
          taskName: taskName,
          previousStatus: previousStatus || 'Pending',
          currentStatus: currentStatus || 'In Progress',
          updatedBy: updatedBy || authenticatedUser?.name || 'System',
          changes: changesMade || [
            { field: 'Status', previous: previousStatus || 'Pending', updated: currentStatus || 'In Progress' }
          ]
        };

        setZohoMailLogs(prev => [newMailObj, ...prev]);
        showToast(`📧 Zoho Mail Sent to ${recipientEmail || 'employee'}: Task #${taskId} Updated`);
      };

      // TL Assign Task State
      const [assignEmp, setAssignEmp] = useState(INITIAL_EMPLOYEES[0].name);
      const [assignPrj, setAssignPrj] = useState(INITIAL_PROJECTS[0].name);
      const [assignTitle, setAssignTitle] = useState('');
      const [assignDesc, setAssignDesc] = useState('');
      const [assignCategory, setAssignCategory] = useState('Planned Work');
      const [assignLevel, setAssignLevel] = useState('High');
      const [assignType, setAssignType] = useState('Project');
      const [assignPriority, setAssignPriority] = useState('High');
      const [assignStartDate, setAssignStartDate] = useState('2026-08-01');
      const [assignEndDate, setAssignEndDate] = useState('2026-08-15');
      const [assignHours, setAssignHours] = useState(16);

      // Live Stopwatch & Work Time Tracker State
      const [nowMs, setNowMs] = useState(Date.now());

      useEffect(() => {
        const timerId = setInterval(() => {
          setNowMs(Date.now());
        }, 1000);
        return () => clearInterval(timerId);
      }, []);

      const formatDuration = (totalSec) => {
        if (!totalSec || totalSec <= 0) return '00m 00s';
        const hrs = Math.floor(totalSec / 3600);
        const mins = Math.floor((totalSec % 3600) / 60);
        const secs = Math.floor(totalSec % 60);
        if (hrs > 0) {
          return `${hrs}h ${mins < 10 ? '0' + mins : mins}m ${secs < 10 ? '0' + secs : secs}s`;
        }
        return `${mins}m ${secs < 10 ? '0' + secs : secs}s`;
      };

      const getTaskDurationSec = (t) => {
        let base = t.elapsedSeconds || 0;
        if (t.isTimerRunning && t.timerStartedAt) {
          const active = Math.floor((nowMs - t.timerStartedAt) / 1000);
          return base + (active > 0 ? active : 0);
        }
        return base;
      };

      const handleStartTaskTimer = (taskId) => {
        setTasks(tasks.map(t => {
          if (t.id === taskId) {
            return {
              ...t,
              status: 'In Progress',
              isTimerRunning: true,
              timerStartedAt: Date.now()
            };
          }
          return t;
        }));

        const targetTask = tasks.find(t => t.id === taskId);
        if (targetTask) {
          triggerZohoMail(
            targetTask.assignee,
            targetTask.assigneeEmail || 'employee@petals.com',
            targetTask.title,
            targetTask.id,
            targetTask.status,
            'In Progress',
            authenticatedUser ? authenticatedUser.name : 'System User',
            [{ field: 'Status & Timer', previous: targetTask.status, updated: '▶️ In Progress (Timer Active)' }]
          );
        }

        showToast(`▶️ Task ${taskId} Started! Stopwatch live counter active.`);
      };

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3500);
      };

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        setLoginError('');
        const foundUser = userDatabase.find(
          u => u.email.toLowerCase() === emailInput.trim().toLowerCase() && u.password === passwordInput.trim()
        );
        if (foundUser) {
          setAuthenticatedUser(foundUser);
          setActiveView('dashboard');
          showToast(`Welcome back, ${foundUser.name}! (${foundUser.role})`);
        } else {
          setLoginError('Invalid credentials. Select an account from the table below.');
        }
      };

      const handleCreateEmployeeSubmit = (e) => {
        e.preventDefault();
        if (!newEmpName.trim() || !newEmpEmail.trim() || !newEmpPassword.trim()) {
          alert('Please enter Name, Email, and Password');
          return;
        }

        const finalDept = (isCustomDept && customDeptText.trim()) ? customDeptText.trim() : newEmpDepartment;

        if (isCustomDept && customDeptText.trim() && !departments.includes(customDeptText.trim())) {
          setDepartments([...departments, customDeptText.trim()]);
        }

        const newEmpId = `emp-${Date.now()}`;
        const newUserId = `usr-${Date.now()}`;

        const newEmpObj = {
          id: newEmpId,
          name: newEmpName.trim(),
          email: newEmpEmail.trim(),
          role: newEmpRole,
          designation: newEmpDesignation.trim(),
          dept: finalDept,
          department: finalDept,
          status: 'Active',
          avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80'
        };

        const newUserObj = {
          id: newUserId,
          name: newEmpName.trim(),
          email: newEmpEmail.trim().toLowerCase(),
          password: newEmpPassword.trim(),
          role: newEmpRole,
          designation: newEmpDesignation.trim(),
          department: finalDept,
          avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80'
        };

        setEmployees([...employees, newEmpObj]);
        setUserDatabase([...userDatabase, newUserObj]);
        setShowAddEmployeeModal(false);
        setNewEmpName('');
        setNewEmpEmail('');
        setNewEmpPassword('');
        setIsCustomDept(false);
        setCustomDeptText('');
        showToast(`New employee ${newEmpName.trim()} created in ${finalDept}! Credentials active.`);
      };

      const handleCreateProjectSubmit = (e) => {
        e.preventDefault();
        if (!newPrjName.trim() || !newPrjCode.trim()) {
          alert('Please fill in Project Name and Project Code');
          return;
        }

        const newPrjObj = {
          id: `prj-${Date.now()}`,
          name: newPrjName.trim(),
          code: newPrjCode.trim().toUpperCase(),
          lead: newPrjLead,
          status: newPrjStatus
        };

        setProjects([...projects, newPrjObj]);
        setShowAddProjectModal(false);
        setNewPrjName('');
        setNewPrjCode('');
        showToast(`Project ${newPrjObj.code} added successfully!`);
      };

      const handleEditProjectSubmit = (e) => {
        e.preventDefault();
        if (!editProjectModal.name.trim() || !editProjectModal.code.trim()) {
          alert('Please fill in Project Name and Code');
          return;
        }

        setProjects(projects.map(p => p.id === editProjectModal.id ? {
          ...p,
          name: editProjectModal.name.trim(),
          code: editProjectModal.code.trim().toUpperCase(),
          lead: editProjectModal.lead,
          status: editProjectModal.status
        } : p));

        setEditProjectModal(null);
        showToast(`Project ${editProjectModal.code} updated successfully.`);
      };

      const handleDeleteProject = (prjId, prjCode) => {
        if (window.confirm(`Are you sure you want to delete Project ${prjCode}?`)) {
          setProjects(projects.filter(p => p.id !== prjId));
          setEditProjectModal(null);
          showToast(`Project ${prjCode} deleted.`);
        }
      };

      const fillCredentials = (email, pass) => {
        setEmailInput(email);
        setPasswordInput(pass);
        setLoginError('');
      };

      const handleLogout = () => {
        setAuthenticatedUser(null);
        showToast('Logged out successfully.');
      };

      // Intercept status dropdown change
      const handleInitiateStatusChange = (taskId, targetStatus) => {
        const taskObj = tasks.find(t => t.id === taskId);
        if (!taskObj) return;

        if (targetStatus === 'On Hold') {
          setStatusPromptModal({
            taskId: taskId,
            taskTitle: taskObj.title,
            targetStatus: 'On Hold',
            titleText: 'Reason for placing Task On Hold',
            placeholderText: 'Please enter why this task is being put on hold (e.g. waiting for hardware IC shipment, waiting for client response)...'
          });
          setPromptInputText('');
        } else if (targetStatus === 'Completed') {
          setStatusPromptModal({
            taskId: taskId,
            taskTitle: taskObj.title,
            targetStatus: 'Completed',
            titleText: 'Completion Summary & Deliverables Done',
            placeholderText: 'Please summarize what work was completed and verified (e.g. CANopen ISR compiled and tested on bench with 0 errors)...'
          });
          setPromptInputText('');
        } else {
          applyTaskStatusUpdate(taskId, targetStatus, null);
        }
      };

      const applyTaskStatusUpdate = (taskId, targetStatus, reasonOrSummary) => {
        const targetTask = tasks.find(t => t.id === taskId);
        const prevStatus = targetTask ? targetTask.status : 'Pending';

        const updated = tasks.map(t => {
          if (t.id === taskId) {
            const updatedRemarks = [...(t.remarks || [])];
            if (reasonOrSummary && reasonOrSummary.trim()) {
              const prefix = targetStatus === 'On Hold' ? '[ON HOLD REASON]' : '[COMPLETED SUMMARY]';
              updatedRemarks.push({
                id: `rem-${Date.now()}`,
                author: authenticatedUser ? authenticatedUser.name : 'System User',
                text: `${prefix}: ${reasonOrSummary.trim()}`,
                timestamp: new Date().toLocaleString()
              });
            }

            const totalSec = getTaskDurationSec(t);
            const isRunning = targetStatus === 'In Progress';

            return {
              ...t,
              status: targetStatus,
              remarks: updatedRemarks,
              isTimerRunning: isRunning,
              timerStartedAt: isRunning ? Date.now() : null,
              elapsedSeconds: totalSec
            };
          }
          return t;
        });

        setTasks(updated);
        setStatusPromptModal(null);
        setPromptInputText('');

        if (targetTask) {
          triggerZohoMail(
            targetTask.assignee,
            targetTask.assigneeEmail || 'employee@petals.com',
            targetTask.title,
            targetTask.id,
            prevStatus,
            targetStatus,
            authenticatedUser ? authenticatedUser.name : 'System User',
            [
              { field: 'Status', previous: prevStatus, updated: targetStatus },
              ...(reasonOrSummary ? [{ field: targetStatus === 'On Hold' ? 'Hold Reason' : 'Summary', previous: 'None', updated: reasonOrSummary.trim() }] : [])
            ]
          );
        }

        showToast(`Task ${taskId} status updated to "${targetStatus}" & note saved!`);
      };

      const handleDeleteTask = (taskId) => {
        if (confirm(`Are you sure you want to delete task ${taskId}?`)) {
          setTasks(tasks.filter(t => t.id !== taskId));
          showToast(`Task ${taskId} deleted successfully.`);
        }
      };

      const handleAssignTaskSubmit = (e) => {
        e.preventDefault();
        if (!assignTitle.trim()) return alert('Please enter task name');
        const assignedObj = employees.find(e => e.name === assignEmp) || employees[0];

        const newTask = {
          id: `TSK-${Math.floor(810 + Math.random() * 90)}`,
          title: assignTitle.trim(),
          project: assignPrj,
          category: assignCategory,
          taskLevel: assignLevel,
          taskType: assignType,
          priority: assignPriority,
          status: 'In Progress',
          assignee: assignEmp,
          assigneeEmail: assignedObj.email,
          teamLeader: authenticatedUser ? authenticatedUser.name : 'Rajesh Kulkarni',
          startDate: assignStartDate,
          dueDate: assignEndDate,
          est: Number(assignHours),
          description: assignDesc || 'Engineering task assigned by Team Leader.',
          remarks: []
        };

        setTasks([newTask, ...tasks]);
        setAssignTitle('');
        setAssignDesc('');
        setActiveView('list-view');

        triggerZohoMail(
          assignEmp,
          assignedObj.email,
          newTask.title,
          newTask.id,
          'Unassigned',
          'In Progress',
          authenticatedUser ? authenticatedUser.name : 'Team Leader',
          [
            { field: 'Assignee', previous: 'None', updated: assignEmp },
            { field: 'Status', previous: 'Created', updated: 'In Progress' },
            { field: 'Due Date', previous: 'None', updated: assignEndDate }
          ]
        );

        showToast(`Task ${newTask.id} assigned to ${assignEmp}! Zoho Mail dispatched.`);
      };

      const role = authenticatedUser ? authenticatedUser.role : 'Employee';
      const roleTasks = role === 'Employee'
        ? tasks.filter(t => t.assignee === authenticatedUser?.name || t.assigneeEmail === authenticatedUser?.email)
        : tasks;

      const statusPriority = {
        'In Progress': 1,
        'Pending': 1,
        'Under Review': 1,
        'On Hold': 2,
        'Completed': 3
      };

      const filteredTasks = roleTasks.filter(t => 
        t.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
        t.id.toLowerCase().includes(searchQuery.toLowerCase()) ||
        t.project.toLowerCase().includes(searchQuery.toLowerCase()) ||
        t.assignee.toLowerCase().includes(searchQuery.toLowerCase())
      ).sort((a, b) => (statusPriority[a.status] || 99) - (statusPriority[b.status] || 99));

      // ==========================================
      // MUTMIZ SOFT SAAS SPLIT-SCREEN LOGIN PAGE
      // ==========================================
      if (!authenticatedUser) {
        return (
          <div className="min-h-screen w-full bg-[#FAFBFF] text-[#202124] flex flex-col lg:flex-row overflow-hidden font-sans">
            
            {/* LEFT SIDE: Soft Lavender Hero Panel */}
            <div className="lg:w-1/2 relative bg-gradient-to-br from-[#F3F1FF] via-[#ECE8FF] to-[#E5E0FF] p-8 lg:p-16 flex flex-col justify-between overflow-hidden">
              <div className="absolute top-10 left-10 w-96 h-96 bg-purple-300/30 rounded-full blur-3xl pointer-events-none" />
              <div className="absolute bottom-10 right-10 w-96 h-96 bg-indigo-300/30 rounded-full blur-3xl pointer-events-none" />

              <div className="relative z-10 flex items-center gap-3">
                <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-[#6D5EF8] to-[#8B7BFF] flex items-center justify-center text-white text-2xl shadow-lg shadow-purple-500/30">
                  🌸
                </div>
                <div>
                  <h2 className="text-xl font-extrabold tracking-tight text-[#202124]">Petals Automation</h2>
                  <span className="text-[11px] font-bold text-[#6D5EF8] uppercase tracking-widest block">Soft SaaS Platform OS</span>
                </div>
              </div>

            <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-full max-w-5xl bg-slate-50 border border-slate-200 rounded-3xl overflow-hidden shadow-2xl flex flex-col h-[85vh]">
                {/* Zoho Header Bar */}
                <div className="bg-[#0f172a] text-white px-6 py-4 flex items-center justify-between border-b border-slate-800">
                  <div className="flex items-center gap-3">
                    <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center font-extrabold text-sm shadow-md">
                      ⚡
                    </div>
                    <div>
                      <h3 className="font-extrabold text-base tracking-tight flex items-center gap-2">
                        Zoho Mail Notification Center
                        <span className="px-2.5 py-0.5 rounded-full text-[10px] bg-blue-500/30 text-blue-300 font-mono border border-blue-400/30">
                          SMTP Active: smtppro.zoho.in
                        </span>
                      </h3>
                      <p className="text-xs text-slate-400">Automated Zoho Mail dispatch logs for task assignments & status updates.</p>
                    </div>
                  </div>

                  <button onClick={() => setShowZohoMailModal(false)} className="text-slate-400 hover:text-white font-bold text-xl px-2 py-1">✕</button>
                </div>

                {/* Main Split Body */}
                <div className="flex-1 flex min-h-0 overflow-hidden">
                  {/* Left: Email List */}
                  <div className="w-1/3 border-r border-slate-200 bg-white overflow-y-auto divide-y divide-slate-100">
                    <div className="p-3.5 bg-slate-100/80 font-extrabold text-[11px] uppercase tracking-wider text-slate-500 flex justify-between items-center sticky top-0 z-10 backdrop-blur-md">
                      <span>Sent Zoho Mails ({zohoMailLogs.length})</span>
                      <span className="text-emerald-600 font-bold flex items-center gap-1">● Live Sync</span>
                    </div>

                    {zohoMailLogs.map(log => {
                      const isSelected = (selectedZohoLog?.id || zohoMailLogs[0]?.id) === log.id;
                      return (
                        <div
                          key={log.id}
                          onClick={() => setSelectedZohoLog(log)}
                          className={`p-4 cursor-pointer transition-colors space-y-1 ${isSelected ? 'bg-purple-50/80 border-l-4 border-l-[#6D5EF8]' : 'hover:bg-slate-50'}`}
                        >
                          <div className="flex items-center justify-between text-[11px]">
                            <span className="font-extrabold text-[#6D5EF8] truncate max-w-[150px]">To: {log.toName || log.to}</span>
                            <span className="text-[10px] text-slate-400 font-mono">{log.timestamp}</span>
                          </div>
                          <p className="font-bold text-xs text-slate-900 line-clamp-1">{log.subject}</p>
                          <p className="text-[10px] text-slate-500 line-clamp-1">From: {log.from}</p>
                        </div>
                      );
                    })}
                  </div>

                  {/* Right: Email Template Viewer matching user's Zoho Mail screenshot */}
                  <div className="w-2/3 bg-[#f4f6f9] p-6 overflow-y-auto flex items-center justify-center">
                    {(() => {
                      const currentMail = selectedZohoLog || zohoMailLogs[0];
                      if (!currentMail) return <div className="text-center text-slate-400 p-10">No Zoho Mails dispatched yet</div>;

                      return (
                        <div className="w-full max-w-xl bg-white rounded-2xl overflow-hidden shadow-xl border border-slate-200 space-y-0 my-auto">
                          {/* Dark Blue Header Banner matching Zoho email screenshot */}
                          <div className="bg-[#0f172a] text-white p-6 text-center space-y-2">
                            <h2 className="text-lg font-extrabold tracking-tight flex items-center justify-center gap-2">
                              ⚡ petals automation
                            </h2>
                            <div className="inline-block px-3 py-1 rounded-full bg-white/15 text-slate-300 text-xs font-bold">
                              ➖ Task Updated
                            </div>
                            <p className="text-[11px] text-slate-400">
                              Task #{currentMail.id.replace('eml-', '')} - Details of a task you own have been updated.
                            </p>
                          </div>

                          {/* Email Body Content */}
                          <div className="p-8 space-y-6 text-slate-700 text-xs leading-relaxed">
                            <div className="space-y-1">
                              <p className="text-sm">
                                Hi <strong>{currentMail.toName || 'Team Member'}</strong>,
                              </p>
                              <p className="text-slate-600">
                                <strong>{currentMail.from}</strong> has details of a task you own updated.
                              </p>
                            </div>

                            {/* Task Summary Box matching screenshot */}
                            <div className="bg-slate-50 border border-slate-200/90 rounded-xl p-5 space-y-2.5">
                              <span className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block">
                                TASK SUMMARY
                              </span>

                              <div className="flex justify-between py-1.5 border-b border-slate-200/60">
                                <span className="font-bold text-slate-500">Task Name</span>
                                <span className="font-extrabold text-slate-900 text-right max-w-xs">{currentMail.taskName}</span>
                              </div>

                              <div className="flex justify-between py-1.5 border-b border-slate-200/60">
                                <span className="font-bold text-slate-500">Previous Status</span>
                                <span className="font-semibold text-slate-600">{currentMail.previousStatus || 'Hold'}</span>
                              </div>

                              <div className="flex justify-between py-1.5 border-b border-slate-200/60">
                                <span className="font-bold text-slate-500">Current Status</span>
                                <span className={`px-3 py-0.5 rounded-full font-extrabold text-[10px] uppercase ${
                                  currentMail.currentStatus === 'Hold' || currentMail.currentStatus === 'HOLD' || currentMail.currentStatus === 'On Hold' ? 'bg-rose-100 text-rose-700 border border-rose-200' :
                                  currentMail.currentStatus === 'Completed' ? 'bg-emerald-100 text-emerald-700 border border-emerald-200' : 'bg-blue-100 text-blue-700 border border-blue-200'
                                }`}>
                                  {currentMail.currentStatus}
                                </span>
                              </div>

                              <div className="flex justify-between py-1.5">
                                <span className="font-bold text-slate-500">Updated By</span>
                                <span className="font-extrabold text-slate-900">{currentMail.updatedBy}</span>
                              </div>
                            </div>

                            {/* Changes Made Table matching screenshot */}
                            {currentMail.changes && currentMail.changes.length > 0 && (
                              <div className="space-y-2">
                                <span className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block">
                                  CHANGES MADE
                                </span>
                                <table className="w-full text-left text-xs border border-slate-200 rounded-xl overflow-hidden">
                                  <thead className="bg-slate-100 text-slate-500 uppercase font-extrabold text-[10px]">
                                    <tr>
                                      <th className="p-2.5">FIELD</th>
                                      <th className="p-2.5">PREVIOUS</th>
                                      <th className="p-2.5">UPDATED</th>
                                    </tr>
                                  </thead>
                                  <tbody className="divide-y divide-slate-100 bg-white">
                                    {currentMail.changes.map((c, i) => (
                                      <tr key={i}>
                                        <td className="p-2.5 font-bold text-slate-800">{c.field}</td>
                                        <td className="p-2.5"><span className="px-2 py-0.5 rounded bg-rose-50 text-rose-600 font-mono text-[11px]">{c.previous}</span></td>
                                        <td className="p-2.5"><span className="px-2 py-0.5 rounded bg-emerald-50 text-emerald-700 font-mono font-bold text-[11px]">{c.updated}</span></td>
                                      </tr>
                                    ))}
                                  </tbody>
                                </table>
                              </div>
                            )}

                            {/* View Task Button */}
                            <div className="text-center pt-2">
                              <button
                                onClick={() => {
                                  setShowZohoMailModal(false);
                                  setActiveView('list-view');
                                }}
                                className="px-6 py-3 rounded-xl bg-[#0f172a] text-white font-extrabold text-xs shadow-md hover:bg-slate-800 transition-colors inline-block cursor-pointer"
                              >
                                View Task in Portal →
                              </button>
                              <p className="text-[10px] text-slate-400 mt-2">
                                If the button doesn't work, log in to the portal and check your task list.
                              </p>
                            </div>
                          </div>
                        </div>
                      );
                    })()}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Floating Toast Notification */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 p-4 rounded-xl btn-purple-gradient text-white font-bold text-xs shadow-2xl z-50">
              {toastMessage}
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<MasterApp />);
  </script>
</body>
</html>
