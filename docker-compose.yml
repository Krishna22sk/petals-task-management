version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: petals_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: petals_task_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: petals_backend_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/petals_task_management?schema=public"
      JWT_SECRET: "petals_enterprise_saas_super_secret_key_2026"
    depends_on:
      - postgres

volumes:
  postgres_data:
